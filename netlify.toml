[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generateTravelPlan"]
  timeout = 30

[functions."createPaypalOrder"]
  timeout = 15

[functions."capturePaypalOrder"]
  timeout = 15

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
