    <!-- 2026-07-30: hreflang x-default 제거. 언어별 고유 URL 이 없다(같은 URL 에서 클라이언트가
         언어를 바꾼다). 게다가 SPA 는 전 경로에 이 HTML 을 주므로 /charter 에서도 x-default 가
         홈을 가리켜 라우트별 canonical(usePageMeta)과 어긋난 신호를 냈다.
         언어별 URL(/en/... 등)을 설계한 뒤에 hreflang 클러스터를 다시 넣는다. -->
    <meta name="theme-color" content="#B668FC" />
    <!-- 브랜드 자산 v2 (2026-06-14): 운영자 공식 로고/앱아이콘 적용
         (public/images/logo-cocotrip.png, public/icons/icon-{192,512}.png, favicon.png).
         public/ 자산-only 변경이 빌드 스킵되던 회귀(#954/#955 .png-only → 4회 CANCELED)를
         scripts/vercel-ignore.sh public/ 가드로 fix. 이 주석은 그 fix 배포 트리거 겸 마커. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- manifest는 vite-plugin-pwa가 자동 주입 (manifest.webmanifest). 수동 link 제거. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- PWA 실행 인트로 — 설치 앱 전용. OS 기본 스플래시 직후 같은 어두운 톤으로 이어받아
         CocoTrip/MOOD 브랜드 이미지를 2.6초 보여준 뒤 앱으로 페이드. 일반 웹 탭에서는 미노출.
         영상 파일 대신 CSS 모션을 쓰는 이유: PWA native splash 는 MP4/GIF를 지원하지 않으므로
         첫 HTML paint 단계에서 가벼운 이미지+파티클 애니메이션으로 "앱 시작 영상"처럼 보이게 함. -->
    <style id="app-splash-style">
      html,body,#root{background:#0a0b14}
      /* 배경 = manifest background_color 동일(cocotrip #0a0b14 / mood #0a0412) — OS 스플래시→인트로 색 점프 0 (seamless 불변식, P-splash 테스트) */
      #app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;overflow:hidden;background:#0a0b14;opacity:1;transition:opacity .42s ease;pointer-events:none}
      #app-splash.mood{background:#0a0412}
      #app-splash:before{content:"";position:absolute;inset:-15%;background:radial-gradient(circle at 50% 50%,rgba(234,83,126,.22),rgba(124,92,252,.18) 20%,rgba(5,5,17,0) 56%);filter:blur(18px);opacity:.9;animation:introPulse 2.6s ease both}
      #app-splash:after{content:"";position:absolute;left:50%;top:50%;width:190vmax;height:190vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(182,104,252,0) 0 9deg,rgba(182,104,252,.14) 10deg,rgba(234,83,126,.08) 12deg,rgba(182,104,252,0) 15deg);opacity:.35;mix-blend-mode:screen;animation:introVortex 2.6s cubic-bezier(.2,.76,.22,1) both}
      #app-splash .intro-frame{position:absolute;inset:0;background-image:var(--intro-image);background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transform:scale(1.025);animation:introImage 2.6s cubic-bezier(.2,.76,.22,1) both}
      /* 첫 비트 = OS 네이티브 스플래시와 동일한 "가운데 앱 아이콘" — 네이티브→커스텀 인트로가
         같은 장면으로 이어져 "로고 떴다가 다시 켜지는" 이중 부팅감 제거 (2026-07-03 handoff).
         아이콘이 잠깐 유지된 뒤 확대되며 인트로 이미지로 크로스페이드. */
      #app-splash .intro-icon{position:absolute;left:50%;top:50%;width:112px;height:112px;transform:translate(-50%,-50%);border-radius:24%;background-image:var(--intro-icon);background-size:cover;background-position:center;opacity:1;animation:introIcon 1.05s ease both}
      #app-splash .intro-flash{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 0 26px #fff,0 0 80px #ea537e,0 0 150px #7c5cfc;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:introFlash 2.6s ease both}
      #app-splash .intro-line{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#5425ff,#b668fc,#ff2b92);box-shadow:0 0 18px #b668fc;transform-origin:center;animation:introLine 2.6s ease both}
      #app-splash.hide{opacity:0}
      /* 인트로 이미지는 아이콘 비트(0~0.34s) 동안 숨어 있다가 페이드인 — 무거운 이미지가 늦게 떠도 아이콘이 가림 */
      @keyframes introImage{0%,13%{opacity:0;transform:scale(1.05)}30%{opacity:1;transform:scale(1.01)}68%{opacity:1;filter:saturate(1.1) brightness(1)}92%{opacity:.9;transform:scale(.82);filter:saturate(1.35) brightness(1.28)}100%{opacity:0;transform:scale(.18);filter:saturate(1.8) brightness(1.8) blur(2px)}}
      @keyframes introIcon{0%,32%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.22)}}
      @keyframes introPulse{0%{opacity:.2;transform:scale(.8)}55%{opacity:.9;transform:scale(1)}100%{opacity:.15;transform:scale(.35)}}
      @keyframes introVortex{0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(1.15)}24%{opacity:.34}100%{opacity:0;transform:translate(-50%,-50%) rotate(120deg) scale(.12)}}
      @keyframes introFlash{0%,55%{opacity:0;transform:translate(-50%,-50%) scale(.2)}76%{opacity:.9;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}
      @keyframes introLine{0%{opacity:0;transform:scaleX(.15)}35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.1)}}
      @media (prefers-reduced-motion:reduce){#app-splash:before,#app-splash:after,#app-splash .intro-frame,#app-splash .intro-flash,#app-splash .intro-line,#app-splash .intro-icon{animation:none}#app-splash .intro-frame{opacity:1;transform:none}#app-splash .intro-icon{display:none}}
      /* 무드 정적 인트로 (2026-07-04 운영자 요청) — "영상 같은" 애니메이션(줌·소용돌이·
         플래시·라인·아이콘 비트) 전부 제거, 협업 사진만 잠깐 떴다 사라짐. 코코트립 인트로는 유지. */
      #app-splash.static:before,#app-splash.static:after{content:none;animation:none}
      #app-splash.static .intro-icon,#app-splash.static .intro-flash,#app-splash.static .intro-line{display:none}
      #app-splash.static .intro-frame{animation:none;opacity:1;transform:none}
    </style>

    <!-- CJK 웹폰트 프리로드 — PDF 렌더 시 한국어/일본어/중국어 글자 깨짐 방지 -->
    <!-- 2026-05-09 (B9-30): display=swap → display=block 변경.
         이유: swap은 fallback 폰트로 즉시 그리고 → Noto 다운로드 완료 후 swap.
         html2canvas가 swap 직전에 캡처하면 system 폰트 (Apple SD Gothic Neo / Malgun Gothic)
         로 PDF 렌더 → 일부 글리프 누락(tofu) 또는 글자 폭 불일치로 layout 깨짐.
         block은 폰트 준비될 때까지 invisible (3초) — LCP 손해 있지만 PDF 안정성 우선.
         body 텍스트는 일반 system-ui/Inter 사용중이므로 LCP 영향 미미. -->

    <!-- Travelpayouts 제휴 리타겟팅 스크립트 제거 (2026-06-11):

         복원하려면 emrldtp.cc/NTE2OTY3.js 스크립트 재삽입. -->

    <!-- Schema.org JSON-LD: WebSite (sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CocoTrip",
      "alternateName": ["Coco Trip", "코코트립"],
      "url": "https://cocotripkr.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cocotripkr.com/tours?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- 설치 PWA 전용 시작 인트로. /mood 는 CocoTrip x MOOD, 그 외는 CocoTrip 단독. -->
    <div id="app-splash" aria-hidden="true">
      <div class="intro-frame"></div>
      <div class="intro-icon"></div>
      <div class="intro-flash"></div>
      <div class="intro-line"></div>
    </div>
    <script>
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true;
          var params = new URLSearchParams(location.search);
          var previewIntro = params.has('intro'); // 로컬/운영자 미리보기용: ?intro=1 또는 ?intro=mood
          if (!standalone && !previewIntro) return; // 일반 웹 방문(브라우저 탭)이면 스플래시 안 띄움
          var el = document.getElementById('app-splash');
          var isMood = location.pathname.indexOf('/mood') === 0 || params.get('intro') === 'mood';
          // base 경로 — .webp(21~23KB, 즉시 페인트) 우선, 미지원 브라우저만 .png(1.2MB) 폴백
          var base = isMood ? '/images/pwa-intro/mood-collab-intro' : '/images/pwa-intro/cocotrip-intro';
          // 첫 비트 아이콘 = manifest 아이콘과 동일 — OS 네이티브 스플래시에서 그대로 이어지는 느낌
          var icon = isMood ? '/icons/mood-512.png' : '/icons/icon-512.png';
          if (isMood) {
            // 2026-07-04 운영자 요청: 무드 인트로는 애니메이션 없이 사진만(정적) + 짧게.
            el.className = 'mood static';
          }
          el.style.setProperty('--intro-icon', 'url("' + icon + '")');
          el.style.setProperty('--intro-image', 'url("' + base + '.webp")');
          try {
            var probe = new Image();
            probe.onerror = function () { el.style.setProperty('--intro-image', 'url("' + base + '.png")'); };
            probe.src = base + '.webp';
          } catch (_) {}
          el.style.display = 'flex';
          var t0 = Date.now();
          var MIN = isMood ? 1200 : 2600, MAX = isMood ? 2200 : 3900, done = false;
          function hide() {
            if (done) return; done = true;
            el.classList.add('hide');
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 560);
          }
          // 앱 첫 화면(홈/무드 포털) 준비 시 호출 — 최소 표시시간 보장 후 페이드. (검정 갭 가림)
          window.__appReady = function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0))); };
          setTimeout(hide, MAX); // 안전 캡: 신호 없어도 사라짐
        } catch (e) { /* 스플래시는 비핵심 — 실패해도 앱은 정상 */ }
      })();
    </script>
    <!-- PWA 설치 프롬프트 조기 캡처 — beforeinstallprompt 가 React 마운트 전에 발화하면 놓쳐서
         [홈 화면에 추가] 버튼이 무반응이 됨. window 에 저장해 PwaInstallButton 이 읽어 쓰게. -->
    <script>
      (function () {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredInstallPrompt = e;
        });
        window.addEventListener('appinstalled', function () { window.__deferredInstallPrompt = null; });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker는 vite-plugin-pwa가 자동 등록 (registerType: 'autoUpdate').
         기존 public/sw.js + 수동 register 코드 제거. -->
  </body>
