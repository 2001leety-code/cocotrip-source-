<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="agd-partner-manual-verification" />

    <!-- SEO: Base meta (crawler fallback — JS SPA can't set these for bots) -->
    <title>CocoTrip — Premium Korea Private Tour & AI Travel Planner</title>
    <meta name="description" content="Private tours, charter vehicles, AI travel planner for Korea. Airport pickup, K-pop shuttle, day tours across Seoul, Busan, Gyeongju & more. Book with CocoTrip." />

    <!-- Open Graph (카카오톡, Facebook, LinkedIn 공유) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CocoTrip" />
    <meta property="og:title" content="CocoTrip — Premium Korea Private Tour" />
    <meta property="og:description" content="AI-powered travel planner & private charter vehicles for Korea. Airport pickup, K-pop shuttle, day tours. No hidden fees." />
    <meta property="og:image" content="https://cocotripkr.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://cocotripkr.com" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CocoTrip — Premium Korea Private Tour" />
    <meta name="twitter:description" content="AI travel planner & private charter vehicles for Korea. No hidden fees." />
    <meta name="twitter:image" content="https://cocotripkr.com/og-image.png" />

    <!-- 추가 SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cocotripkr.com" />
    <meta name="theme-color" content="#B668FC" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- manifest는 vite-plugin-pwa가 자동 주입 (manifest.webmanifest). 수동 link 제거. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CocoTrip" />

    <!-- CJK 웹폰트 프리로드 — PDF 렌더 시 한국어/일본어/중국어 글자 깨짐 방지 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" />

    <!-- Travelpayouts affiliate tracking -->
    <script>
      (function () {
          var script = document.createElement("script");
          script.async = 1;
          script.src = 'https://emrldtp.cc/NTE2OTY3.js?t=516967';
          document.head.appendChild(script);
      })();
    </script>

    <!-- Schema.org JSON-LD: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "CocoTrip",
      "url": "https://cocotripkr.com",
      "logo": "https://cocotripkr.com/favicon.png",
      "image": "https://cocotripkr.com/og-image.png",
      "description": "Premium Korea private tours, charter vehicles, AI travel planner. Airport pickup, K-pop shuttle, day tours across Seoul, Busan, Gyeongju & more.",
      "telephone": "+82-10-0000-0000",
      "email": "cocotripkr@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "B01, 30 Hangang-daero 81-gil",
        "addressLocality": "Yongsan-gu",
        "addressRegion": "Seoul",
        "postalCode": "04377",
        "addressCountry": "KR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 37.5326,
        "longitude": 126.9644
      },
      "priceRange": "$$",
      "areaServed": {
        "@type": "Country",
        "name": "South Korea"
      },
      "sameAs": [
        "https://www.instagram.com/cocotrip_kr"
      ]
    }
    </script>

    <!-- Schema.org JSON-LD: WebSite (sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CocoTrip",
      "url": "https://cocotripkr.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cocotripkr.com/tours?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker는 vite-plugin-pwa가 자동 등록 (registerType: 'autoUpdate').
         기존 public/sw.js + 수동 register 코드 제거. -->
  </body>
</html>
