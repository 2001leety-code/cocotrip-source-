    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- PWA 실행 스플래시 (설치 standalone 에서만) — 폰화면에 맞춘 풀 이미지(미크롭) 그대로 노출.
         앱이 준비될 때까지 유지(검정 갭 방지) 후 페이드. 일반 웹(브라우저 탭)에선 안 보임.
         (#948 에서 잘린 아이콘 쓰던 것 → 풀 이미지로 환원, 운영자 요청 2026-06-14) -->
    <style id="app-splash-style">
      #app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:flex-end;justify-content:center;background-color:#0a0b14;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:1;transition:opacity .45s ease;pointer-events:none}
      #app-splash.mood{background-color:#0a0412}
      #app-splash .tag{margin-bottom:13%;color:#fff;font-size:15px;font-weight:600;opacity:.95;text-align:center;padding:0 32px;max-width:340px;line-height:1.45;letter-spacing:.2px;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.7)}
      #app-splash.hide{opacity:0}
    </style>

    <!-- CJK 웹폰트 프리로드 — PDF 렌더 시 한국어/일본어/중국어 글자 깨짐 방지 -->
    <!-- 2026-05-09 (B9-30): display=swap → display=block 변경.
         이유: swap은 fallback 폰트로 즉시 그리고 → Noto 다운로드 완료 후 swap.
         html2canvas가 swap 직전에 캡처하면 system 폰트 (Apple SD Gothic Neo / Malgun Gothic)
         로 PDF 렌더 → 일부 글리프 누락(tofu) 또는 글자 폭 불일치로 layout 깨짐.
         block은 폰트 준비될 때까지 invisible (3초) — LCP 손해 있지만 PDF 안정성 우선.
         body 텍스트는 일반 system-ui/Inter 사용중이므로 LCP 영향 미미. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=block" />

    <!-- 2026-05-04: PayPal SDK preconnect 제거. PR #216 이후 결제 흐름은 Braintree
         drop-in 으로 일원화됨 (api/braintreeCheckout.js). PayPal SDK 직접 로드 없음. -->

    <!-- Travelpayouts 제휴 리타겟팅 스크립트 제거 (2026-06-11):
         "최근 검색한 여행" 팝업이 Klook 등 경쟁사 "Book now" 광고를 자기 사이트에 노출 →
         우리 투어 사러 온 손님을 경쟁사로 보내 전환 손해. 제휴 수수료(푼돈) < 이탈 손실 → 제거.
         복원하려면 emrldtp.cc/NTE2OTY3.js 스크립트 재삽입. -->

    <!-- Schema.org JSON-LD: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "CocoTrip",
      "url": "https://cocotripkr.com",
      "logo": "https://cocotripkr.com/favicon.png",
      "image": "https://cocotripkr.com/og-image.png",
      "description": "Premium Korea private tours, charter vehicles, AI travel planner. Airport pickup, K-pop shuttle, day tours across Seoul, Busan, Gyeongju & more.",
      "telephone": "+82-10-0000-0000",
      "email": "cocotripkr@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "B01, 30 Hangang-daero 81-gil",
        "addressLocality": "Yongsan-gu",
        "addressRegion": "Seoul",
        "postalCode": "04377",
        "addressCountry": "KR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 37.5326,
        "longitude": 126.9644
      },
      "priceRange": "$$",
      "areaServed": {
        "@type": "Country",
        "name": "South Korea"
      },
      "sameAs": [
        "https://www.instagram.com/cocotrip_kr"
      ]
    }
    </script>

    <!-- Schema.org JSON-LD: WebSite (sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CocoTrip",
      "url": "https://cocotripkr.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cocotripkr.com/tours?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- 설치 PWA 실행 스플래시 — 인라인이라 React 마운트 전 즉시 페인트(깜빡임 없음). 풀 이미지. -->
    <div id="app-splash" aria-hidden="true">
      <div class="tag" id="app-splash-tag"></div>
    </div>
    <script>
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true;
          if (!standalone) return; // 일반 웹 방문이면 스플래시 안 띄움
          var el = document.getElementById('app-splash');
          var tag = document.getElementById('app-splash-tag');
          var isMood = location.pathname.indexOf('/mood') === 0;
          if (isMood) {
            // 무드: 폰화면 풀 이미지만 (태그라인 없음)
            el.className = 'mood';
            el.style.backgroundImage = "url('/splash-mood.png')";
            tag.textContent = '';
          } else {
            // 코코트립: 폰화면 풀 이미지 + 하단 영어 태그라인
            el.style.backgroundImage = "url('/splash-cocotrip.png')";
            tag.textContent = 'Plan your Korea trip in 60 seconds with AI ✈️';
          }
          el.style.display = 'flex';
          var t0 = Date.now();
          var MIN = 1400, MAX = 4500, done = false;
          function hide() {
            if (done) return; done = true;
            el.classList.add('hide');
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 520);
          }
          // 앱이 첫 화면을 그릴 준비가 되면 호출 (홈/무드 포털) — 최소 표시시간 보장 후 페이드.
          window.__appReady = function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0))); };
          setTimeout(hide, MAX); // 안전 캡: 신호 없어도 사라짐
        } catch (e) { /* 스플래시는 비핵심 — 실패해도 앱은 정상 */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker는 vite-plugin-pwa가 자동 등록 (registerType: 'autoUpdate').
         기존 public/sw.js + 수동 register 코드 제거. -->
  </body>
</html>
