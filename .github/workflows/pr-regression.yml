name: PR Regression Suite

# 받아적기 12항목 자동 회귀 검증.
# PR 머지 전 'ready-for-regression' 라벨 trigger 로 1회 prod 실행 (Gemini 1회 호출 비용).
# 도입 배경: Gemini 비결정성으로 같은 fix 가 일부 plan 에서 회귀 재발.
# 사용자 prod 시각 검수 의존도 -> 자동 assertion 으로 대체.
#
# Secrets 필요 (GitHub Settings -> Secrets and variables -> Actions):
#   FIREBASE_WEB_API_KEY    -> .env 의 VITE_FIREBASE_API_KEY 와 동일
#   HEALTH_CHECK_EMAIL      -> admin 계정 (TEST- prefix 바이패스 권한)
#   HEALTH_CHECK_PASSWORD   -> admin 계정 비밀번호

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (수동 실행 시)'
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

# 같은 PR 새 푸시 시 이전 run 즉시 취소
concurrency:
  group: pr-regression-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # 라벨 trigger 만 실행 (PR push 마다 X — 비용 절약)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 의존성 설치 X — 회귀 슈트는 native fetch 만 사용 (node 20 글로벌)

      - name: Run regression suite
        id: regression
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          BASE_URL: https://cocotripkr.com
        run: |
          set -o pipefail
          node scripts/validate-prod-regression.mjs 2>&1 | tee regression-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post result to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('regression-output.txt', 'utf8');
            } catch (e) {
              output = '(no output captured)';
            }
            const exitCode = '${{ steps.regression.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASS' : '❌ FAIL';
            const body = [
              `## ${status} — 받아적기 12항목 회귀 검증`,
              '',
              `**Target:** https://cocotripkr.com`,
              `**Trigger:** \`ready-for-regression\` 라벨`,
              '',
              '<details><summary>실행 로그</summary>',
              '',
              '```',
              output.slice(-3500),
              '```',
              '',
              '</details>',
              '',
              exitCode === '0'
                ? '머지 가능. 회귀 없음 확인.'
                : '⚠️ FAIL 항목 fix 또는 회귀 가설 검증 필요. 머지 차단.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
