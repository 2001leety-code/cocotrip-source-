name: Weekly i18n Audit

on:
  schedule:
    # Mondays 02:00 UTC = KST 11:00 — early enough to catch issues before the week
    - cron: '0 2 * * 1'
  workflow_dispatch: # manual trigger

jobs:
  i18n-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # iPhone 14 Pro 프로젝트가 webkit 엔진을 쓰므로 chromium + webkit 둘 다 설치.
        run: npx playwright install --with-deps chromium webkit

      - name: Check i18n key parity (4 locales aligned to ko.json)
        run: npm run check:i18n

      - name: Run i18n locale smoke test (3 viewports)
        env:
          BASE_URL: https://cocotripkr.com
        run: |
          npx playwright test tests/e2e/i18n-locale-smoke.spec.ts \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/report
          retention-days: 14
