name: Weekly i18n Audit

on:
  schedule:
    # Mondays 02:00 UTC = KST 11:00 — early enough to catch issues before the week
    - cron: '0 2 * * 1'
  workflow_dispatch: # manual trigger

jobs:
  i18n-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가. pr-i18n-smoke 와 동일 패턴.
      # 같은 cache key 공유 (OS + package-lock hash) → PR/cron 양쪽 hit 율 ↑.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # iPhone 14 Pro 프로젝트가 webkit 엔진을 쓰므로 chromium + webkit 둘 다 설치.
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Check i18n key parity (4 locales aligned to ko.json)
        run: npm run check:i18n

      - name: Run i18n locale smoke test (3 viewports)
        env:
          BASE_URL: https://cocotripkr.com
        run: |
          npx playwright test tests/e2e/i18n-locale-smoke.spec.ts \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/report
          retention-days: 14
