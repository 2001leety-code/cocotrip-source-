name: Legacy Guide Import Audit

# Blogger 공개 피드는 후보 알림 통로일 뿐 승인 원천이 아니다.
# 2026-08-22까지의 이관 장부가 바뀌거나 범위 밖 새 Blogger 글이 나타나는지
# 매일 읽기 전용으로 감지한다. 새 글 정본은 Brain projection 계약이다.
# 이 workflow 는 글을 쓰거나 커밋하거나 Blogger 를 수정하지 않는다.
on:
  schedule:
    - cron: '20 1 * * *' # KST 10:20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Node import audit도 브라우저와 같은 DOMPurify allowlist를 쓰므로 jsdom 설치가 필요하다.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # pending/invalid/approved-unsynced 또는 범위 밖 신규 Blogger 글이 있으면
      # 빨갛게 끝나 무시된 드리프트를 숨기지 않는다.
      - name: Check reviewed guide import state
        run: npm run guide:legacy-check
