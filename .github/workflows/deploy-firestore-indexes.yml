name: Deploy Firestore Indexes

# 🔴 2026-07-28: firestore.indexes.json 에 색인을 적어놓고도 **배포하는 단계가 없었다.**
#   그래서 /admin/intent-classifier 가 운영에서 "복합 색인이 필요합니다" 오류를 냈다
#   (used_llm_fallback + ts 조합은 파일에 이미 선언돼 있었다).
#   main 에 색인 파일이 바뀌어 들어오면 자동 배포한다. 수동 실행도 가능.
#
# 색인 배포는 **추가만** 한다(기존 쿼리 무영향). Firebase CLI가 요구하던 별도
# Service Usage 권한 없이 Firestore Admin API를 직접 사용한다. 기존 색인은 삭제하지 않는다.
#
# 필요한 GitHub Secret: FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체), FIREBASE_PROJECT_ID.
#   둘 중 하나라도 없으면 성공처럼 건너뛰지 않고 명확히 실패한다.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'scripts/deploy-firestore-indexes-rest.mjs'
      - '.github/workflows/deploy-firestore-indexes.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firestore-indexes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate index file
        run: |
          node -e "const j=require('./firestore.indexes.json'); if(!Array.isArray(j.indexes)) { console.error('firestore.indexes.json: indexes 배열이 없습니다'); process.exit(1); } console.log('indexes:', j.indexes.length);"

      - name: Require deployment credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT_ID" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 또는 FIREBASE_PROJECT_ID가 없습니다."
            exit 1
          fi

      - name: Deploy indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SA" > /tmp/sa.json
          trap 'rm -f /tmp/sa.json' EXIT
          node scripts/deploy-firestore-indexes-rest.mjs \
            --project "$PROJECT_ID" \
            --apply \
            --wait
