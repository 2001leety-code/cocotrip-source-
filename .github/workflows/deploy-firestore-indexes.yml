name: Deploy Firestore Indexes

# 🔴 2026-07-28: firestore.indexes.json 에 색인을 적어놓고도 **배포하는 단계가 없었다.**
#   그래서 /admin/intent-classifier 가 운영에서 "복합 색인이 필요합니다" 오류를 냈다
#   (used_llm_fallback + ts 조합은 파일에 이미 선언돼 있었다).
#   main 에 색인 파일이 바뀌어 들어오면 자동 배포한다. 수동 실행도 가능.
#
# 색인 배포는 **추가만** 한다(기존 쿼리 무영향). 삭제는 --force 없이는 일어나지 않으므로
# 이 워크플로는 안전하다. 롤백은 파일에서 해당 색인을 지우고 Firebase 콘솔에서 삭제.
#
# 필요한 GitHub Secret: FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체)
#   미설정이면 SKIP 하고 성공 처리한다 — 색인 배포 실패가 다른 배포를 막지 않게.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-indexes.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firestore-indexes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate index file
        run: node -e "const j=require('./firestore.indexes.json'); if(!Array.isArray(j.indexes)) { console.error('firestore.indexes.json: indexes 배열이 없습니다'); process.exit(1); } console.log('indexes:', j.indexes.length);"

      - name: Skip when credentials are missing
        id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 미설정 — 색인 배포 SKIP (운영자가 시크릿 등록 후 재실행)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy indexes
        if: steps.gate.outputs.skip == 'false'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SA" > /tmp/sa.json
          npx --yes firebase-tools@latest deploy \
            --only firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive
