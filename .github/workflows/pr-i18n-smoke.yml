name: PR i18n Smoke (Vercel Preview)

# Triggered when Vercel finishes deploying a preview. Runs the same i18n
# locale smoke as the weekly job, but against the per-PR preview URL so
# regressions surface during review instead of waiting for Monday.

on:
  deployment_status:

# Cancel old runs when a newer preview lands. Each Playwright run is ~9min
# with 3 viewports — saves big when an active PR gets pushed multiple times.
concurrency:
  group: pr-i18n-smoke-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Only run on successful Vercel preview deployments (not Production, not
    # other vendors). Vercel's preview env is named "Preview".
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    # 2026-05-13 PR #402: 10 → 15 분 상향. 배경: PR #397 + #401 두 차례 10m15s
    # timeout. Playwright 4-lang × 3-viewport (~12 browser run) + Vercel preview
    # 초기 cold start + 가격 환산 PR 등의 i18n locale 로드 증가로 한도 초과.
    # 15분이면 안전 마진 확보 — 기존 normal 3-4분 (캐시 hit) / cold start 7-9분.
    timeout-minutes: 15

    steps:
      - name: Checkout PR head (use deployment ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가. 1차 fail 원인: install --with-deps
      # 가 9~10분 걸려 timeout 10m 초과. 캐시 hit 시 ~30s, miss 시 기존 그대로.
      # 키 = OS + package-lock.json hash (Playwright 버전 변경 시 자동 무효화).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # iPhone 14 Pro 프로젝트가 webkit 엔진을 쓰므로 chromium + webkit 둘 다 설치.
        # 이전엔 chromium만 설치 → iPhone 14 Pro 케이스 3ms 즉시 실패 (Executable not found at webkit-XXX/pw_run.sh).
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # 브라우저 바이너리는 ~/.cache/ms-playwright 에 캐시되지만 system deps
        # (apt 패키지 — libnss3/libgbm1 등) 는 /var/lib 라서 매번 install-deps 필요.
        run: npx playwright install-deps chromium webkit

      - name: Run i18n locale smoke against preview URL (3 viewports)
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          # Vercel Pro Deployment Protection bypass — preview URLs return 401
          # without this. See playwright.config.ts for the header wiring.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright test tests/e2e/i18n-locale-smoke.spec.ts \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: tests/report
          retention-days: 14
