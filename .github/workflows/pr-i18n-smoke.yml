name: PR i18n Smoke (Vercel Preview)

# Triggered when Vercel finishes deploying a preview. Runs the same i18n
# locale smoke as the weekly job, but against the per-PR preview URL so
# regressions surface during review instead of waiting for Monday.
#
# 2026-05-13 (PR #404): Also triggers on `pull_request` for paths Vercel
# ignores (.github/**, docs/**, **/*.md, .agent/**). Without this, branch
# protection's required `smoke` check BLOCKED forever for workflow-only PRs
# (deployment_status never fires when Vercel skips preview build).
# See PR #402 incident: workflow timeout bump itself was unmergeable until
# admin override. For mixed PRs (workflow + src), both pull_request auto-pass
# AND deployment_status real smoke fire; latest wins (real smoke authoritative).
#
# 2026-05-19 (PR after #477): Extended paths to mirror scripts/vercel-ignore.sh
# IGNORE_RE — scripts/**, tests/**, reports/**, outputs/**, food_data/**,
# preview/** + various dotfiles + images/logs. Same root cause: Vercel skips
# build for these paths → deployment_status absent → smoke BLOCKED on
# scripts-only PRs (eg PR #478 vercel-ignore.sh fix itself).
# IMPORTANT: keep in sync with vercel-ignore.sh — drift causes silent re-occur.

on:
  deployment_status:
  pull_request:
    paths:
      - '.github/**'
      - '**/*.md'
      - 'docs/**'
      - '.agent/**'
      - '.claude/**'
      - '.idx/**'
      - '.vscode/**'
      - 'tests/**'
      - 'scripts/**'
      - 'reports/**'
      - 'outputs/**'
      - 'food_data/**'
      - 'preview/**'
      - 'deploys.txt'
      - 'error.log'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.claudeignore'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.ico'
      - '**/*.txt'
      - '**/*.log'

# Cancel old runs when a newer preview lands. Each Playwright run is ~9min
# with 3 viewports — saves big when an active PR gets pushed multiple times.
concurrency:
  group: pr-i18n-smoke-${{ github.event.deployment.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    # 2026-05-13 PR #402: 10 → 15 분 상향. 배경: PR #397 + #401 두 차례 10m15s
    # timeout. Playwright 4-lang × 3-viewport (~12 browser run) + Vercel preview
    # 초기 cold start + 가격 환산 PR 등의 i18n locale 로드 증가로 한도 초과.
    # 15분이면 안전 마진 확보 — 기존 normal 3-4분 (캐시 hit) / cold start 7-9분.
    timeout-minutes: 20

    steps:
      # Workflow/docs-only PRs: Vercel ignores these paths → no preview deploy
      # → deployment_status never fires → required `smoke` check absent → BLOCKED.
      # This auto-pass step closes that gap. See PR #402 incident (PR #404 fix).
      - name: Auto-pass — workflow/docs-only PR (no preview deploy)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::PR matches Vercel-ignored paths — no preview deployment expected."
          echo "::notice::Auto-pass to satisfy branch protection 'smoke' required check."

      - name: Checkout PR head (use deployment ref)
        if: github.event_name == 'deployment_status'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Setup Node.js
        if: github.event_name == 'deployment_status'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'deployment_status'
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가. 1차 fail 원인: install --with-deps
      # 가 9~10분 걸려 timeout 10m 초과. 캐시 hit 시 ~30s, miss 시 기존 그대로.
      # 키 = OS + package-lock.json hash (Playwright 버전 변경 시 자동 무효화).
      - name: Cache Playwright browsers
        if: github.event_name == 'deployment_status'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: github.event_name == 'deployment_status' && steps.playwright-cache.outputs.cache-hit != 'true'
        # iPhone 14 Pro 프로젝트가 webkit 엔진을 쓰므로 chromium + webkit 둘 다 설치.
        # 이전엔 chromium만 설치 → iPhone 14 Pro 케이스 3ms 즉시 실패 (Executable not found at webkit-XXX/pw_run.sh).
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright browsers + deps (cache hit verify)
        if: github.event_name == 'deployment_status' && steps.playwright-cache.outputs.cache-hit == 'true'
        # P187 (2026-05-25): cache HIT 라도 restore-keys 로 partial restore 발생 가능 →
        # browser binary 누락. install 명령은 이미 있는 browser fast skip → cache 효과
        # 유지하며 회귀 차단. system deps (libnss3/libgbm1 등 /var/lib) 도 동봉.
        run: |
          npx playwright install chromium webkit
          npx playwright install-deps chromium webkit

      - name: Run i18n locale smoke against preview URL (3 viewports)
        if: github.event_name == 'deployment_status'
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          # Vercel Pro Deployment Protection bypass — preview URLs return 401
          # without this. See playwright.config.ts for the header wiring.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright test tests/e2e/i18n-locale-smoke.spec.ts \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      # 위저드 전체 플로우 E2E — 결제 클릭은 안 함 (Test 7 = PayPal 버튼 존재만, Test 8/9 = 보안 403).
      # PR 단계에서 위저드 UI 회귀(Step 0 도시선택·모바일 overflow 등)를 자동 차단 —
      # 그동안 위저드는 prod daily-health 에만 있어 PR 시점 자동 검증 사각지대였음.
      # Desktop Chrome 1개만(전체 플로우라 무거움). i18n smoke 실패해도 독립 실행(if: always).
      - name: Run planner wizard full-flow E2E (Desktop Chrome, no payment)
        if: always() && github.event_name == 'deployment_status'
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright test tests/e2e/planner-full-flow.spec.ts \
            --project='Desktop Chrome'

      - name: Upload Playwright report
        if: always() && github.event_name == 'deployment_status'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: tests/report
          retention-days: 14
