name: PR i18n Smoke (Vercel Preview)

# Triggered when Vercel finishes deploying a preview. Runs the same i18n
# locale smoke as the weekly job, but against the per-PR preview URL so
# regressions surface during review instead of waiting for Monday.
#
# 2026-05-13 (PR #404): Also triggers on `pull_request` for paths Vercel
# ignores (.github/**, docs/**, **/*.md, .agent/**). Without this, branch
# protection's required `smoke` check BLOCKED forever for workflow-only PRs
# (deployment_status never fires when Vercel skips preview build).
# See PR #402 incident: workflow timeout bump itself was unmergeable until
# admin override. For mixed PRs (workflow + src), both pull_request auto-pass
# AND deployment_status real smoke fire; latest wins (real smoke authoritative).
#
# 2026-05-19 (PR after #477): Extended paths to mirror scripts/vercel-ignore.sh
# IGNORE_RE — scripts/**, tests/**, reports/**, outputs/**, food_data/**,
# preview/** + various dotfiles + images/logs. Same root cause: Vercel skips
# build for these paths → deployment_status absent → smoke BLOCKED on
# scripts-only PRs (eg PR #478 vercel-ignore.sh fix itself).
# IMPORTANT: keep in sync with vercel-ignore.sh — drift causes silent re-occur.

on:
  deployment_status:
  pull_request:
    paths:
      - '.github/**'
      - '**/*.md'
      - 'docs/**'
      - '.agent/**'
      - '.claude/**'
      - '.idx/**'
      - '.vscode/**'
      - 'tests/**'
      - 'scripts/**'
      - 'reports/**'
      - 'outputs/**'
      - 'food_data/**'
      - 'preview/**'
      - 'deploys.txt'
      - 'error.log'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.claudeignore'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.ico'
      - '**/*.txt'
      - '**/*.log'

# Cancel old runs when a newer preview lands. Each Playwright run is ~9min
# with 3 viewports — saves big when an active PR gets pushed multiple times.
concurrency:
  group: pr-i18n-smoke-${{ github.event.deployment.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    # 2026-10-23: ubuntu-latest 가 2026-10-12 부터 26.04 — 캐시된 Playwright webkit 이 libicu74(24.04)를 요구해 실패. 버전 고정.
    runs-on: ubuntu-24.04
    # 2026-05-13 PR #402: 10 → 15 분 상향. 배경: PR #397 + #401 두 차례 10m15s
    # timeout. Playwright 4-lang × 3-viewport (~12 browser run) + Vercel preview
    # 초기 cold start + 가격 환산 PR 등의 i18n locale 로드 증가로 한도 초과.
    # 15분이면 안전 마진 확보 — 기존 normal 3-4분 (캐시 hit) / cold start 7-9분.
    #
    # 2026-08-19 PR #1323: 15 → 25 분 재상향. 배경: 같은 run 의 rerun 이 "Install
    # Playwright browsers (cache miss)" 단계에서 4연속 cancelled (conclusion
    # "cancelled", 실패 로그 없음 — job timeout 이 install 도중 강제 종료시켜서
    # 원인 파악도 어려웠음). Playwright CDN/apt 다운로드가 느려지면 cache miss
    # install(chromium+webkit) 만으로 15분을 넘길 수 있다는 뜻. 같은 run 재시도는
    # 계속 실패했고, 새 커밋(빈 커밋)으로 새 run 을 돌리자 통과 — timeout 자체가
    # 병목이었음을 확인. 25분이면 cold install 이 아무리 늦어져도 테스트 실행
    # 시간까지 죽이지 않을 여유가 생김.
    timeout-minutes: 25

    steps:
      # Workflow/docs-only PRs: Vercel ignores these paths → no preview deploy
      # → deployment_status never fires → required `smoke` check absent → BLOCKED.
      # This auto-pass step closes that gap. See PR #402 incident (PR #404 fix).
      - name: Auto-pass — workflow/docs-only PR (no preview deploy)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::PR matches Vercel-ignored paths — no preview deployment expected."
          echo "::notice::Auto-pass to satisfy branch protection 'smoke' required check."

      - name: Checkout PR head (use deployment ref)
        if: github.event_name == 'deployment_status'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Setup Node.js
        if: github.event_name == 'deployment_status'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'deployment_status'
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가. 1차 fail 원인: install --with-deps
      # 가 9~10분 걸려 timeout 10m 초과. 캐시 hit 시 ~30s, miss 시 기존 그대로.
      # 키 = OS + package-lock.json hash (Playwright 버전 변경 시 자동 무효화).
      # 2026-11-19: this step is a no-op here. Vercel creates deployments by commit SHA,
      # so GITHUB_REF is empty on deployment_status and actions/cache skips both restore
      # and save ("Event Validation Error: The event type deployment_status is not
      # supported because it's not tied to a branch or tag ref"). Every real smoke run is
      # a cold install; playwright-cache-prime cannot help it. Kept only so the key stays
      # aligned with the other Playwright workflows (tests/unit/daily-health-playwright-browsers.test.ts).
      - name: Cache Playwright browsers
        if: github.event_name == 'deployment_status'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu-24.04-playwright-chromium-webkit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-playwright-chromium-webkit-

      - name: Install Playwright browsers + system deps
        if: github.event_name == 'deployment_status'
        # iPhone 14 Pro 프로젝트가 webkit 엔진을 쓰므로 chromium + webkit 둘 다 설치.
        # 이전엔 chromium만 설치 → iPhone 14 Pro 케이스 3ms 즉시 실패 (Executable not found at webkit-XXX/pw_run.sh).
        #
        # 2026-08-19 (#1323, #1328): installs could hang past the job timeout -> per-attempt
        # timeout + 3 attempts.
        # 2026-11-19: when the time ran out during apt, that retry could not work.
        # `--with-deps` runs apt-get through sudo, i.e. as root, and a runner-user `timeout`
        # cannot signal a root process: apt-get kept running with /var/lib/dpkg/lock-frontend
        # held and attempts 2-3 failed in seconds ("Could not get lock ... held by process
        # NNNN (apt-get)"; runs 44461319505 and 44471524508, slow apt mirror). Now two loops:
        #   1) system packages, with `timeout` itself run as root so it can signal apt-get and
        #      its download helpers. dpkg runs in its own session and dies a moment after
        #      apt-get, so before the next try wait 10 s, then finish any dpkg run the kill cut
        #      off (time-limited too). .debs already downloaded stay in /var/cache/apt/archives,
        #      so a retry continues rather than starts over.
        #      The CLI is called directly, not through npx, to keep npm out of the root shell.
        #   2) browser download as the runner user, inside timeout's process group, so a hung
        #      download (and Playwright's forked download child) dies and the retry downloads again.
        # Both together normally take under 70 s, so 300 s per attempt only guards against hangs.
        # One step for any cache state: browsers already present are skipped fast, and a
        # partial restore still gets its missing binaries (P187, 2026-05-25).
        run: |
          ok=""
          for attempt in 1 2 3; do
            if sudo env "PATH=$PATH" timeout -k 30 300 ./node_modules/.bin/playwright install-deps chromium webkit; then ok=1; break; fi
            echo "::warning::System packages attempt ${attempt} failed or timed out - retrying"
            sleep 10; sudo timeout 120 dpkg --configure -a || true
          done
          [ -n "$ok" ]
          ok=""
          for attempt in 1 2 3; do
            if timeout -k 30 300 npx playwright install chromium webkit; then ok=1; break; fi
            echo "::warning::Browser download attempt ${attempt} failed or timed out - retrying"
          done
          [ -n "$ok" ]

      - name: Run i18n locale smoke against preview URL (3 viewports)
        if: github.event_name == 'deployment_status'
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          # Vercel Pro Deployment Protection bypass — preview URLs return 401
          # without this. See playwright.config.ts for the header wiring.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/report/i18n-locale-smoke
        run: |
          npx playwright test tests/e2e/i18n-locale-smoke.spec.ts \
            --output test-results/i18n-locale-smoke \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      # 운영 전용 daily-health 에만 있던 SPA 내비 검사를 PR 미리보기에도 연결한다.
      # 선택자/testid 변경이 며칠 뒤 예약 검사에서 처음 드러나는 공백을 막는다.
      - name: Run SPA nav smoke against preview URL (3 viewports)
        if: github.event_name == 'deployment_status'
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/report/nav-link-transitions
        run: |
          npx playwright test tests/e2e/nav-link-transitions.spec.ts \
            --output test-results/nav-link-transitions \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      # /charter 첫 진입 마찰 (2026-08-01). 돈이 들어오는 페이지의 첫 화면이 팝업으로
      # 덮여 있던 사고의 회귀 방지(당시 인용한 "14명" 수치는 자동 테스트 오염분으로 정정됨).
      # 오버레이가 견적 입력을 가리는 상황을 3개 뷰포트에서 잡는다.
      # 공용 픽스처(tests/e2e/fixtures/analytics-guard.ts)가 GA4·PostHog 요청을 context
      # 단위로 끊고, 빠져나간 요청이 있으면 테스트를 실패시킨다 → 테스트 방문이 지표를 오염시키지 않는다.
      # analytics-guard.spec.ts 는 그 차단기 자체가 살아 있는지 검사한다.
      - name: Run analytics guard + charter entry friction against preview URL (3 viewports)
        if: github.event_name == 'deployment_status'
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/report/analytics-charter
        run: |
          npx playwright test \
            tests/e2e/analytics-guard.spec.ts \
            tests/e2e/charter-entry-friction.spec.ts \
            tests/e2e/charter-funnel-probe.spec.ts \
            --output test-results/analytics-charter \
            --project='Desktop Chrome' \
            --project='Pixel 5' \
            --project='iPhone 14 Pro'

      # NOTE(2026-06-28): 위저드 full-flow E2E 를 여기 붙이려 했으나 preview 환경에서
      # x-vercel-protection-bypass 헤더가 gstatic 폰트 preflight(CORS)에서 거부 -> 폰트
      # 로드 실패 console error 로 spec 이 죽음(prod daily-health 엔 없는 preview 특유 문제).
      # 위저드 E2E 는 prod daily-health 에 유지. PR 배선은 폰트 CORS 해결 후 재시도.

      - name: Upload Playwright report
        if: always() && github.event_name == 'deployment_status'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: tests/report/
          retention-days: 14
