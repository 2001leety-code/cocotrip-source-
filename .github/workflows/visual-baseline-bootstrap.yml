name: Visual Baseline Bootstrap

# 자율 검증 매트릭스 L4 (visual regression) 의 baseline PNG 를 CI Linux 환경
# (Ubuntu, chromium) 에서 자동 생성. Docker / WSL 없는 운영자 환경 대응.
#
# 사용 (1회 실행):
#   gh workflow run visual-baseline-bootstrap.yml --ref main
#
# 동작:
#   1) Ubuntu runner 에서 Playwright chromium install
#   2) BASE_URL=https://cocotripkr.com (prod) 으로 --update-snapshots 실행
#      → tests/visual/**/*-snapshots/ 디렉토리에 -linux.png baseline 생성
#   3) 새 branch chore/visual-baseline-linux-<timestamp> 생성 + PR
#
# 결과 PR 머지 후 pr-visual-regression.yml 의 continue-on-error 가 fail 시
# strict 차단으로 동작. 별도 PR 로 continue-on-error 제거 (후속).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for screenshot capture (default: prod)'
        required: false
        default: 'https://cocotripkr.com'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate baseline snapshots
        env:
          BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # --update-snapshots: baseline 없으면 생성 / 있으면 overwrite.
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots

      - name: Check if baseline files generated
        id: check
        run: |
          if [ -d tests/visual ] && find tests/visual -name '*-snapshots' -type d | grep -q .; then
            count=$(find tests/visual -name '*.png' | wc -l)
            echo "baseline_count=$count" >> $GITHUB_OUTPUT
            echo "::notice::Generated $count baseline PNG files"
          else
            echo "baseline_count=0" >> $GITHUB_OUTPUT
            echo "::warning::No baseline files generated — check playwright config + spec files"
          fi

      - name: Create branch + PR with baseline
        if: steps.check.outputs.baseline_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="chore/visual-baseline-linux-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/visual/
          if git diff --cached --quiet; then
            echo "::warning::No new baseline files — nothing to commit"
            exit 0
          fi
          git commit -m "chore(visual): bootstrap baseline PNG from Linux CI (auto)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(visual): bootstrap baseline (Linux CI auto-generated)" \
            --body "Auto-generated by \`visual-baseline-bootstrap.yml\` workflow_dispatch.\n\nBase URL: ${{ inputs.base_url }}\nBaseline files: ${{ steps.check.outputs.baseline_count }}\n\n**Review before merge** — visual check 가 사용자 의도에 맞는지 확인. 머지 후 \`pr-visual-regression.yml\` 의 \`continue-on-error\` 제거 별도 PR 로 strict 모드 전환." \
            --base main \
            --head "$BRANCH"

      - name: Upload baseline as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-snapshots
          path: tests/visual
          retention-days: 30
