name: PR Owner Android unsigned compile

on:
  pull_request:
    paths:
      - 'android-owner/**'
      - '.github/workflows/pr-owner-android.yml'

permissions:
  contents: read

concurrency:
  group: owner-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with wrapper validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Confirm preinstalled Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-}"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Compile unsigned owner APK
        working-directory: android-owner
        run: ./gradlew :app:assembleVerify --no-daemon

      - name: Confirm APK exists and remains unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android-owner/app/build/outputs/apk/verify"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          unzip -tqq "$APK"
          BADGING="$("$AAPT2" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.cocotrip.owner'"
          set +e
          SIGN_OUTPUT="$("$APKSIGNER" verify --verbose "$APK" 2>&1)"
          SIGN_STATUS=$?
          set -e
          if [ "$SIGN_STATUS" -eq 0 ]; then
            echo "FAIL: verify APK must remain unsigned"
            exit 1
          fi
          test "$SIGN_STATUS" -eq 1
          printf '%s\n' "$SIGN_OUTPUT" | grep -Fq 'DOES NOT VERIFY'
          echo "PASS: unsigned owner APK compiled and was not uploaded"
