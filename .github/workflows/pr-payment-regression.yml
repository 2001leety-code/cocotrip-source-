name: PR Payment Regression Suite

# CocoTrip 자율 검증 v2 P0 — PayPal 결제 흐름 8 assertion 자동 회귀 검증.
# 현재 사용자 결제 fail 신고해야만 알 수 있는 결제 흐름 회귀 (0건/일 검출 → 사후 발견)
# 를 PR 머지 전 자동 assertion 으로 대체.
#
# 8 assertion: B-PAY1 ~ B-PAY8
#   B-PAY1: PayPal SDK script 로드 (VITE_PAYPAL_CLIENT_ID 필요, 미설정 시 skip)
#   B-PAY2: createPaypalOrder endpoint 입력 검증 + AI 플래너 쿠폰 reject
#   B-PAY3: Manual payment request (paypal-me-qr → pending_bookings)
#   B-PAY4: 5% 쿠폰 productScope (charter OK / AI plan reject)
#   B-PAY5: Trip Coins redeem percent (fixed-USD 잔존 0 — soft)
#   B-PAY6: Webhook idempotency (같은 transmission-id 2회 → 일관)
#   B-PAY7: Webhook signature verify (잘못된 sig → 거부)
#   B-PAY8: 환불 흐름 (REFUNDED webhook 처리 path)
#
# Secrets 필요:
#   FIREBASE_WEB_API_KEY    -> .env 의 VITE_FIREBASE_API_KEY
#   HEALTH_CHECK_EMAIL      -> admin 계정 (ADMIN_BYPASS_EMAILS 등록 필수)
#   HEALTH_CHECK_PASSWORD   -> admin 계정 비밀번호
#   VITE_PAYPAL_CLIENT_ID   -> (선택) B-PAY1 SDK 로드 검증용 — 미설정 시 skip+warning

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (수동 실행 시)'
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

# 같은 PR 새 푸시 시 이전 run 즉시 취소
concurrency:
  group: pr-payment-regression-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-regression:
    # 라벨 trigger 만 실행 (PR push 마다 X — 비용 절약)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-payment-regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 의존성 설치 X — 슈트는 native fetch 만 사용 (node 20 글로벌)

      - name: Run payment regression suite
        id: payment_regression
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
          BASE_URL: https://cocotripkr.com
          SCENARIO_NAME: payment-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'manual' }}
        run: |
          set -o pipefail
          node scripts/validate-prod-payment.mjs 2>&1 | tee payment-regression-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post result to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('payment-regression-output.txt', 'utf8');
            } catch (e) {
              output = '(no output captured)';
            }
            const exitCode = '${{ steps.payment_regression.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASS' : '❌ FAIL';
            const body = [
              `## ${status} — 결제 흐름 회귀 검증 (8 assertion / 자율 검증 v2 P0)`,
              '',
              `**Target:** https://cocotripkr.com`,
              `**Trigger:** \`ready-for-payment-regression\` 라벨`,
              '',
              '<details><summary>실행 로그</summary>',
              '',
              '```',
              output.slice(-3500),
              '```',
              '',
              '</details>',
              '',
              exitCode === '0'
                ? '머지 가능. 결제 흐름 회귀 없음 확인.'
                : '⚠️ FAIL 항목 fix 또는 회귀 가설 검증 필요. 머지 차단.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
