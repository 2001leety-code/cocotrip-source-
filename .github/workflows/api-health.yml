name: API Health Check

# Lv1 자동 감지 — 현재 운영 계약에 맞춰 인증·Firebase Admin·핵심 공개 경로를 검증한다.
# 고객 개인정보·예약번호·금액·토큰·응답 본문은 로그에 출력하지 않는다.

on:
  schedule:
    # UTC 0/12 = KST 9/21 — 12시간 간격, 월 60분 이내. 비용 0 (무료 tier 안).
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe current production contracts
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
        run: node scripts/api-health-check.mjs
