name: PR Tests

# Fast PR-time checks: TypeScript build + Vitest unit tests with coverage.
# Lighthouse + Playwright e2e run on Vercel preview separately (see
# pr-i18n-smoke.yml + pr-lighthouse.yml).

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build (Vercel parity)
        run: npx tsc -b --force

      - name: Vitest unit tests with coverage
        # Per-file thresholds enforced in vitest.config.ts (lines 75 / branches 60 /
        # functions 65 / statements 75 for src/schemas + api/_shared/{log,paypal}.js)
        run: npm run test:unit:coverage

      - name: i18n key parity (4 locales aligned to ko.json)
        run: npm run check:i18n

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr-${{ github.run_id }}
          path: coverage
          retention-days: 14
