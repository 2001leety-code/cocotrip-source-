name: PR Tests

# Fast PR-time checks: Vitest unit tests with coverage + i18n key parity.
# Lighthouse + Playwright e2e run on Vercel preview separately (see
# pr-i18n-smoke.yml + pr-lighthouse.yml).
#
# Type-check 의도적 제거 (2026-05-08): Vercel preview 빌드가 매 PR마다
# `tsc -b && vite build`를 실행하므로 GitHub Actions에서 tsc를 중복 실행할
# 필요 없음. 같은 코드를 2번 type-check 하면서 Build CPU 비용만 두 배.
# Vercel preview가 타입 오류를 catch — fail 시 PR 머지 차단됨.
# (또한 vitest는 esbuild로 ts를 직접 처리 → tsc 출력에 의존하지 않음.
#  tsconfig.app.json + tsconfig.node.json 둘 다 noEmit:true 라서 어차피
#  artifact 도 안 나옴.)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'

# Cancel previous runs when a new push comes in. Active branches push often;
# only the latest commit needs validation.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Skip draft PRs — devs flip to "Ready for review" when validation matters.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # vercel-ignore.sh 는 프리뷰 배포 여부를 결정한다 — 잘못되면 프리뷰가 조용히 사라진다.
      # #1125: 멀티커밋 PR 의 마지막 커밋이 tests/ 하나라 PR 전체 빌드가 스킵 → 프리뷰 URL
      # 소실 → 운영자 sandbox 결제 e2e(머지 게이트) 차단. 스크립트 주석은 이 테스트를
      # "회귀 차단" 수단으로 명시했지만 실제로는 어디서도 실행되지 않아 가드가 죽어 있었다.
      # npm 불필요(순수 bash+git)라 수초면 끝난다.
      - name: vercel-ignore.sh 회귀 테스트 (프리뷰 스킵 로직)
        run: bash scripts/test-vercel-ignore.sh

      # NOTE: tsc -b 단계 의도적 제거. Vercel preview 가 동일 작업 수행 →
      # 이중 빌드 회피 (Build CPU 시간 대폭 절감, 5/1~5/8 244h → 추정 50%↓).
      # 타입 오류 시 Vercel preview deployment가 fail → PR Bundle Size 도
      # 후속으로 fail 하므로 머지 차단됨.

      - name: Vitest unit tests with coverage
        # Per-file thresholds enforced in vitest.config.ts (lines 75 / branches 60 /
        # functions 65 / statements 75 for src/schemas + api/_shared/{log,paypal}.js)
        run: npm run test:unit:coverage

      - name: i18n key parity (4 locales aligned to ko.json)
        run: npm run check:i18n

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ github.run_id }}
          path: coverage
          retention-days: 14
