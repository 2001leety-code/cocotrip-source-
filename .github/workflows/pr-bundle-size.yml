name: PR Bundle Size

# Builds the production bundle on every PR and asserts size budgets defined
# in .size-limit.json. Catches "this PR doubled the main bundle" regressions
# before merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.size-limit.json'

concurrency:
  group: pr-bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vercel parity)
        run: npx vite build

      - name: Check bundle size budgets
        run: npm run check:size
