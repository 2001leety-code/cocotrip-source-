name: PR Bundle Size

# Builds the production bundle on every PR and asserts size budgets defined
# in .size-limit.json. Catches "this PR doubled the main bundle" regressions
# before merge.

on:
  pull_request:
    branches: [main]
    # 2026-05-13 PR #398: paths → paths-ignore 전환.
    # 배경: branch protection 의 required check 가 'bundle-size' 인데, 기존
    # paths 매칭 (src/** 등) 안 되는 PR (예: api/ 만 변경한 PR #397) 은 workflow
    # 실행 자체 안 됨 → required check 미존재 → 머지 영구 차단.
    # 해결: docs/md 만 ignore, 나머지 모든 변경에서 trigger.
    # 비용: ~1분 빌드 추가 발생하지만 branch protection 일관성 우선.
    #
    # 2026-05-19: tests/** 제거. PR #487 (tests/visual baseline PNG only)
    # 가 같은 함정으로 BLOCKED — bundle-size workflow 가 tests/** ignore 라
    # trigger 안 돼서 required check absent. admin merge 로 우회했음. 영구
    # 차단을 위해 tests/** 도 매 PR trigger (build artifact 검사용).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agent/**'

concurrency:
  group: pr-bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vercel parity)
        run: npx vite build

      - name: Check bundle size budgets
        run: npm run check:size
