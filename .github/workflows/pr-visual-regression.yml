name: PR Visual Regression (Vercel Preview)

# 자율 검증 사각지대 L4 게이트 — 시각 회귀 / 모바일 viewport.
# Vercel preview deploy 완료 후 trigger, baseline 과 pixel-diff 비교.
# P93 (모바일 section 탭 overflow) 같은 layout 회귀가 PR 머지 전 차단.
#
# 위반 시: PR 머지 차단 + diff PNG artifact 업로드 (운영자가 다운로드해서 확인).
#
# Baseline 없는 신규 spec: --update-snapshots 후 commit-back 은 미구현 — 운영자가
# 로컬 Docker 로 baseline 생성 후 별도 commit (tests/visual/README.md 참조).
# 본 워크플로우는 baseline 없으면 fail (Playwright default). 그러나 본 PR
# 인프라 도입 시점에는 baseline PNG 가 main 에 없으므로, baseline 없으면
# soft-pass (continue-on-error) 처리 → 운영자 baseline commit 후부터 strict.

on:
  deployment_status:
  # 2026-08-10 (#1272 P2): tests-only 푸시는 Vercel 이 프리뷰 빌드를 스킵하므로
  # deployment_status 가 영원히 오지 않고, 아래 pull_request auto-pass 만 남아
  # "실행 없는 초록" 이 된다. 그럴 때 **같은 앱 번들의 기존 프리뷰 URL** 을 주고
  # 실제 Linux 실행으로 검증할 수 있게 수동 트리거를 추가한다.
  # PR 게이트 동작은 무변경(추가 경로일 뿐) — 자동 트리거 두 개의 조건은 그대로다.
  workflow_dispatch:
    inputs:
      base_url:
        description: '검증 대상 preview URL (같은 앱 번들의 기존 배포)'
        required: true
        type: string
  # docs/test/script/workflow only PR 도 통과시키기 위해 pull_request fallback.
  # pr-i18n-smoke 와 동일 paths 패턴.
  pull_request:
    paths:
      - '.github/**'
      - '**/*.md'
      - 'docs/**'
      - '.agent/**'
      - '.claude/**'
      - 'tests/**'
      - 'scripts/**'

concurrency:
  group: pr-visual-regression-${{ github.event.deployment.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    # 2026-08-19: 10 → 18 분 상향. 배경: pr-i18n-smoke 의 자매 job(`smoke`)이
    # 같은 원인(Playwright CDN/apt 지연으로 cache-miss install 이 job timeout 을
    # 넘김)으로 4연속 cancelled 됐고(PR #1323), 이 `visual` job 도 "Install
    # Playwright chromium (cache miss)" 단계에서 같은 패턴으로 1회 cancelled.
    # smoke 는 15→25분(1.67배)으로 올렸다 — visual 은 설치 브라우저가 chromium
    # 하나뿐이라 부담이 더 작지만 같은 CDN 지연에 취약하므로 비례해 10→18분
    # (원인이 install 단계이지 테스트 실행 시간이 아니라서 과도한 상향은 피함).
    timeout-minutes: 18

    steps:
      - name: Auto-pass — workflow/docs-only PR (no preview deploy)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::PR matches Vercel-ignored paths — no preview deployment expected."
          echo "::notice::Auto-pass to satisfy branch protection 'visual' required check."

      - name: Checkout PR head (use deployment ref)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}

      - name: Setup Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: npm ci

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 2026-08-19: 이 단계가 느려지면(Playwright CDN/apt 지연) job timeout 을
      # 넘겨 cancelled 발생 (PR #1323, smoke job 과 동일 패턴). job timeout 을
      # 10→18분으로 올려 대응 — 위 job 레벨 주석 참고.
      # 2026-08-19 2차: 18분으로도 잘림(#1328) — 지연이 아니라 다운로드가 '매달리는'
      # 케이스. 시도별 7분 timeout + 3회 재시도로 매달린 다운로드를 죽이고 다시 받는다.
      # (구조 원인: 이 캐시는 PR 브랜치들끼리 공유 안 됨 + main 에선 이 워크플로가
      # 안 돌아 main 캐시가 없음 → 매 PR 콜드 미스. playwright-cache-prime.yml 이
      # main 캐시를 채워 근본 해소 — 이 재시도는 그래도 미스날 때의 백신.)
      - name: Install Playwright chromium (cache miss)
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          ok=""
          for attempt in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "::warning::Playwright install attempt ${attempt} timed out or failed - retrying"
          done
          [ -n "$ok" ]

      - name: Install Playwright system deps (cache hit)
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check baseline exists
        if: github.event_name != 'pull_request'
        id: baseline-check
        run: |
          # snapshot 디렉토리들 검색. landing-mobile.spec.ts-snapshots 같은 패턴.
          count=$(find tests/visual -type d -name '*-snapshots' 2>/dev/null | wc -l)
          echo "snapshot_dirs=$count" >> $GITHUB_OUTPUT
          if [ "$count" = "0" ]; then
            echo "::warning::No visual baselines found — soft-pass mode. Operator must generate baselines locally per tests/visual/README.md."
          fi

      - name: Run visual regression against preview URL
        if: github.event_name != 'pull_request'
        # baseline 없으면 fail 하되 workflow 는 soft-pass — 인프라 도입 단계 대응.
        # baseline commit 후에는 이 continue-on-error 제거 (strict 모드).
        continue-on-error: ${{ steps.baseline-check.outputs.snapshot_dirs == '0' }}
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # P244: Firebase auth inject 용 — 미설정 시 unauthenticated 상태로 진행
          # (window.__pageReady 가 error state 에서도 emit → 테스트는 항상 settle).
          # 설정 시 plan body 를 실제 렌더링한 authenticated baseline 생성 가능.
          VITE_FIREBASE_API_KEY: ${{ secrets.PREVIEW_FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.PREVIEW_HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.PREVIEW_HEALTH_CHECK_PASSWORD }}
          PDF_GOLDEN_PLAN_ID: ${{ secrets.PREVIEW_PDF_GOLDEN_PLAN_ID }}
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload visual diff report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-pr-${{ github.run_id }}
          path: tests/visual-report
          retention-days: 14
