name: Daily Health Check

on:
  schedule:
    # UTC 00:00 = KST 09:00, 월/수/금만 (주 3회).
    # 매일 → 월수금 변경: GitHub Actions minutes 절감 (validate-planner.cjs는
    # Gemini 5회 호출이라 cold path에서 5-10분 소요).
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # 수동 실행 가능

# Daily Sentinel (L3) — regression FAIL 시 GH issue 자동 생성용 권한.
# 자율 검증 시스템 v1 L3 — PR 없어도 prod 자체 monitoring.
# 2026-05-11 (PR #347): health-log.jsonl commit 을 위해 contents: write 필수.
# 누락 시 git push 403 Forbidden (기존 commit step 항상 fail 무한반복).
permissions:
  contents: write # health-log commit (기존)
  issues: write   # L3: regression FAIL 시 자동 issue 생성

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # L3 regression step 추가로 15 → 20 상향

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Health Check
        env:
          # 2026-05-04 PR #247 (audit P0-#2) 이후 /api/ai-planner-full 는
          # Authorization: Bearer <idToken> 필수. validate-planner.cjs 는
          # Firebase Auth REST API 로 idToken 발급 → Bearer 헤더 주입.
          # docs/AUTOMATION.md 의 secret 등록 가이드 참조.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          NODE_OPTIONS: '--experimental-fetch'
        run: node scripts/daily-health-check.mjs

      # E2E PROD smoke — 결제→플랜→번역→PDF 7-step 자동 검증.
      # 사용자 100번 사이클 차단 게이트 (Test 3: blind "car·25분" 0건).
      # daily-health 와 같은 일정으로 실행 (월/수/금) — 비용 ~$0.10/run × 13/월 = $1.30/월.
      # validate-planner 실패해도 진행 (continue-on-error) — E2E는 독립적으로 prod 검증.
      - name: Install dependencies (for Playwright)
        if: always()
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가. chromium only (daily-health 는 webkit 미사용).
      # 별도 cache key (chromium-only) — pr-i18n-smoke 의 chromium+webkit 캐시와 분리.
      # 같은 key 쓰면 cache hit 시 webkit 도 받지만 install-deps chromium 만 호출이라 의존성 누락 가능.
      - name: Cache Playwright Chromium
        if: always()
        uses: actions/cache@v4
        id: playwright-cache-chromium
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Chromium (cache miss)
        if: always() && steps.playwright-cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: always() && steps.playwright-cache-chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E PROD smoke (Plan + Translation + PDF)
        if: always()
        env:
          BASE_URL: https://cocotripkr.com
          # PR #247 audit P0-#2 이후 plan 생성 step 도 Bearer 헤더 필수.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
        run: npx playwright test full-plan-translation-pdf --project='Desktop Chrome' --reporter=list
        continue-on-error: true # E2E 실패해도 health-log commit 단계 실행

      # ─── L3 Daily Sentinel — 받아적기 12항목 회귀 슈트 자동 실행 ────────────────
      # PR 없어도 prod 회귀를 매 cron 마다 검증. validate-prod-regression.mjs 는
      # ADMIN-BYPASS- prefix 로 실 결제 없이 5일 다도시 plan 1회 생성 + 12 assertion.
      # Secrets: pr-regression.yml 과 동일 (FIREBASE_WEB_API_KEY / HEALTH_CHECK_EMAIL /
      # HEALTH_CHECK_PASSWORD). 이미 등록돼 있다는 전제 — 미등록 시 stderr 로 명시 후 fail.
      # 비용: Gemini 1회 호출 ~$0.04/run × 13/월 ≈ $0.52/월.
      - name: Run regression suite (L3)
        id: regression
        if: always()
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          BASE_URL: https://cocotripkr.com
        run: |
          set -o pipefail
          if node scripts/validate-prod-regression.mjs 2>&1 | tee regression-output.txt; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true # FAIL 해도 다음 step (issue/alert/upload) 실행

      # 실패 시 GitHub Issue 자동 생성. 최근 7일 동안 같은 title 이슈가 open 상태면
      # 새로 만들지 않고 코멘트만 추가 (중복 issue spam 차단).
      - name: Auto-create issue on regression failure (L3)
        if: always() && steps.regression.outputs.result == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          DATE_UTC=$(date -u +%Y-%m-%d)
          TITLE="🔴 Daily regression FAIL — ${DATE_UTC}"

          # 최근 7일 같은 title open issue 검색 (label=regression)
          EXISTING=$(gh issue list \
            --state open \
            --label regression \
            --limit 10 \
            --json number,title,createdAt \
            --search "Daily regression FAIL in:title" || echo "[]")

          # 7일 이내 동일 title 검사 (jq 없이 grep 으로 단순 체크)
          DUPE=$(echo "$EXISTING" | grep -c "Daily regression FAIL" || true)

          # output 마지막 1500자 (issue body 길이 제한 대비)
          OUTPUT_TAIL=""
          if [ -f regression-output.txt ]; then
            OUTPUT_TAIL=$(tail -c 1500 regression-output.txt)
          fi

          # 헤리독 indentation 우회 — 각 줄을 printf 로 빌드 (leading whitespace 보존 X)
          BODY=$(printf '%s\n' \
            "> L3 Daily Sentinel 자동 생성 — daily-health workflow 의 regression suite 가 FAIL 했어." \
            "> fix가 필요하면 이 issue에 \`@claude fix해줘\` 라고 답글로 호출해." \
            "" \
            "- workflow run: ${WORKFLOW_URL}" \
            "- target: https://cocotripkr.com" \
            "- 회귀 슈트: \`scripts/validate-prod-regression.mjs\` (받아적기 12항목)" \
            "- 실행 시각 (UTC): ${DATE_UTC}" \
            "" \
            "## 다음 액션" \
            "" \
            "1. workflow run 로그 확인 — 어떤 assertion 이 fail 했는지 확인" \
            "2. 회귀 가설 검증 — 최근 머지 PR 중 영향 가능성 있는 변경 grep" \
            "3. fix PR 머지 후 \`ready-for-regression\` 라벨로 재검증" \
            "4. 통과 확인 후 이 issue close" \
            "" \
            "## 실행 로그 (마지막 1500자)" \
            "" \
            "\`\`\`" \
            "${OUTPUT_TAIL}" \
            "\`\`\`")

          if [ "$DUPE" -gt 0 ]; then
            # 첫 매칭 issue 번호 추출 후 코멘트 추가
            ISSUE_NUM=$(echo "$EXISTING" | grep -oE '"number":[0-9]+' | head -1 | grep -oE '[0-9]+')
            if [ -n "$ISSUE_NUM" ]; then
              gh issue comment "$ISSUE_NUM" --body "$BODY" || true
              echo "Updated existing issue #${ISSUE_NUM}"
            fi
          else
            gh issue create \
              --title "$TITLE" \
              --label "regression,auto-detected" \
              --body "$BODY" || true
            echo "Created new issue: $TITLE"
          fi
        continue-on-error: true # issue 생성 실패해도 alert step 진행

      # 텔레그램 알림 — TELEGRAM_BOT_TOKEN 미설정 시 graceful skip (secret presence guard).
      # GitHub Actions 에서 secrets 는 step env 로 노출. 직접 != '' 비교는 secret 마스킹으로
      # 동작 안 함 → step 내부 shell 에서 [ -z ] 체크.
      - name: Telegram alert on regression failure (L3)
        if: always() && steps.regression.outputs.result == 'fail'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️  TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID 미설정 — alert skip"
            exit 0
          fi
          MSG="🔴 *Daily Sentinel — Regression FAIL*%0A%0A날짜 (UTC): $(date -u +%Y-%m-%d)%0A대상: https://cocotripkr.com%0A%0AGitHub run:%0A${WORKFLOW_URL}%0A%0A자동 issue 생성됨 — repo Issues 확인"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            > /dev/null || echo "⚠️  Telegram API call failed (non-fatal)"
        continue-on-error: true # alert 실패해도 workflow 통과

      - name: Upload health log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-log-${{ github.run_id }}
          path: scripts/health-log.jsonl
          retention-days: 90

      - name: Commit health log
        id: commit_log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # health-log.jsonl만 commit. planner-report.json은 .gitignore에 등록돼
          # 있어 commit 불가 (이미 actions/upload-artifact로 90일 보존 중이라
          # repo에 둘 필요 없음).
          git add scripts/health-log.jsonl || true
          if git diff --cached --quiet; then
            echo "No changes to commit (artifact 보존)"
            echo "result=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: daily health check $(date -u +%Y-%m-%d)" || true
          # P175 (2026-05-24): silent fail 차단. 기존 `git push || echo` 패턴은
          # main branch protection (GH006) reject 도 silent → 5/14~5/24 11일간
          # health-log.jsonl commit 누락 발견 지연. push 실패 시 명시적 output
          # set + telegram alert step 진입 (continue-on-error 유지 — artifact 는
          # 90일 보존이라 데이터 손실 없음, 단 monitoring 시스템 silent 차단).
          if git push 2>&1 | tee push-output.txt; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::health-log.jsonl push failed (likely main branch protection — GH006)"
            cat push-output.txt
            echo "result=fail" >> "$GITHUB_OUTPUT"
            # exit 1 하지 않음 — artifact 보존 + 다음 step (alert) 진입.
          fi
        continue-on-error: true

      - name: Telegram alert on health-log push failure (P175)
        if: always() && steps.commit_log.outputs.result == 'fail'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️  TELEGRAM secrets 미설정 — alert skip"
            exit 0
          fi
          MSG="🟠 *health-log.jsonl push 실패*%0A%0AGH006 protected branch reject 가능성.%0Aartifact 는 90일 보존 — 데이터 손실 없음.%0A%0Arun:%0A${WORKFLOW_URL}%0A%0A운영자 액션: branch protection 의 github-actions[bot] 예외 또는 별도 storage 검토."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            > /dev/null || echo "⚠️  Telegram API call failed (non-fatal)"
        continue-on-error: true
