name: Daily Health Check

on:
  schedule:
    # UTC 00:00 = KST 09:00, 월/수/금 (주 3회).
    # 매일 → 월수금 변경: GitHub Actions minutes 절감 (validate-planner.cjs는
    # Gemini 5회 호출이라 cold path에서 5-10분 소요).
    #
    # 🔴 2026-08-07 (#1216 후속): 월(1) / 수·금(3,5) 두 cron 분리를 되돌렸다.
    #   분리 머지(8/3 01:24Z)가 월요일 00:00Z 틱의 지연 처리(평소 2~2.5시간)와 겹치며
    #   8/3 월요일 스케줄 실행이 통째로 유실됐고, 수·금 실행은 플랜 스모크 스텝을
    #   skip(초록)으로 지나가 "가장 비싼 무인 감시가 0회" 인 걸 아무도 몰랐다.
    #   cron 은 몇 주간 검증된 단일 '0 0 * * 1,3,5' 로 복원하고, "월요일에만" 은
    #   cron 문자열 비교가 아니라 실행 시각(아래 weekday 스텝)으로 판정한다.
    #   플랜 스모크는 운영 Firestore 에 실제 플랜 문서를 만들고 AI 비용이 들므로
    #   주 1회(월요일, 약 $0.45)만 — 운영자 결정(2026-08-02)은 그대로다.
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # 수동 실행 가능

# Daily Health 핵심 단계 FAIL 시 GH issue 자동 생성용 권한.
# 자율 검증 시스템 v1 L3 — PR 없어도 prod 자체 monitoring.
# health-log는 artifact로만 보관하므로 저장소 쓰기 권한은 필요 없다.
permissions:
  actions: read  # 플랜 스모크 실행 이력 조회
  contents: read # checkout
  issues: write  # 핵심 단계 FAIL 시 issue 생성·갱신

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # L3 regression step 추가로 15 → 20 상향

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Health Check
        id: daily_health
        env:
          # 2026-05-04 PR #247 (audit P0-#2) 이후 /api/ai-planner-full 는
          # Authorization: Bearer <idToken> 필수. validate-planner.cjs 는
          # Firebase Auth REST API 로 idToken 발급 → Bearer 헤더 주입.
          # docs/AUTOMATION.md 의 secret 등록 가이드 참조.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          NODE_OPTIONS: '--experimental-fetch'
        run: node scripts/daily-health-check.mjs

      # E2E PROD smoke — 결제→플랜→번역→PDF 7-step 자동 검증.
      # 사용자 100번 사이클 차단 게이트 (Test 3: blind "car·25분" 0건).
      # daily-health 와 같은 일정으로 실행 (월/수/금) — 비용 ~$0.10/run × 13/월 = $1.30/월.
      # validate-planner 실패해도 아래 단계들은 always() 로 독립 실행하며 최종 판정은 실패로 유지한다.
      - name: Install dependencies (for Playwright)
        id: npm_install
        if: always()
        run: npm ci

      # Cache Playwright browsers — 2026-05-12 추가.
      # 2026-08-02: webkit 추가. nav 스모크에 iPhone 14 Pro 프로젝트가 들어왔는데
      #   `devices['iPhone 14 Pro']` 의 기본 엔진이 **webkit** 이다(Pixel 5 는 chromium).
      #   chromium 만 설치한 상태로 돌리면 "Please run: npx playwright install" 로
      #   iPhone 5건이 통째로 실패한다 — 그런데 이 스텝은 continue-on-error 라
      #   **잡 결과는 초록인데 스모크만 빨간** 상태가 되어 눈치채기 어렵다(실측).
      #   cache key 도 함께 바꿔야 한다. 안 바꾸면 chromium-only 캐시가 hit 되어
      #   설치 스텝이 건너뛰어지고 webkit 이 영원히 없다.
      - name: Cache Playwright browsers
        if: always()
        uses: actions/cache@v4
        id: playwright-cache-chromium
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-webkit-

      - name: Install Playwright browsers (cache miss)
        id: playwright_install
        if: always() && steps.playwright-cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        id: playwright_deps
        if: always() && steps.playwright-cache-chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      # 🔴 continue-on-error 를 다시 붙이지 말 것 (2026-08-02).
      #   예전 주석은 "E2E 실패해도 health-log commit 단계 실행" 이라고 했지만, 아래 단계들은
      #   전부 `if: always()` 라서 **continue-on-error 없이도 그대로 실행된다.** 실제 효과는
      #   하나뿐이었다 — 스텝 결과를 무조건 success 로 만들어 **고장을 초록으로 덮는 것.**
      #   그 덕에 2026-07-20 이후 이 검사가 매번 403 으로 죽는데도 7회 넘게 아무도 몰랐다.
      #   실패는 빨갛게 보여야 한다.
      #
      # 월요일 판정 스텝 — cron 문자열 비교 금지 (2026-08-07 #1216 후속).
      #   옛 게이트("이벤트의 schedule 문자열 == '0 0 * * 1'")는 schedule 목록의 리터럴과
      #   묶이지 않은 두 번째 사본이라, cron 이 바뀌면 게이트가 조용히 영원-false 가 된다
      #   (잠금 테스트가 그 표현 자체를 금지해 여기 주석에도 원문을 못 쓴다).
      #   실행 시각으로 판정하면 cron 을 어떻게 바꿔도 게이트가 따라온다.
      - name: Resolve weekday (Monday-only plan smoke gate)
        id: weekday
        if: always()
        run: echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT" # 1=월요일 (UTC)

      # 월요일에만 돈다: 이 스모크는 운영 Firestore 에 실제 플랜 문서를 만들고 AI 비용이 든다.
      #   수동 실행(workflow_dispatch)에서는 항상 돈다 — 사람이 일부러 누른 것이므로.
      - name: E2E PROD smoke (Plan + Translation + PDF)
        id: plan_smoke
        if: always() && (github.event_name == 'workflow_dispatch' || steps.weekday.outputs.dow == '1')
        env:
          BASE_URL: https://cocotripkr.com
          # PR #247 audit P0-#2 이후 plan 생성 step 도 Bearer 헤더 필수.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
        run: npx playwright test full-plan-translation-pdf --project='Desktop Chrome' --reporter=list

      # ─── 플랜 스모크 신선도 감시견 (2026-08-07 #1216 후속) ─────────────────────
      # "스킵이 초록으로 보이는" 병 차단. 월요일 실행이 유실되면(8/3 실측) 수·금 실행은
      # 위 스텝을 skip 으로 지나가 아무도 모른다. 스킵 자체는 정상이라 스텝 색으로는 못
      # 잡는다 — 그래서 매 스케줄 실행마다 "플랜 스모크가 마지막으로 **시도**된 지 8일
      # 이내인가" 를 실행 이력(API)으로 검사하고, 넘겼으면 이 잡을 빨갛게 죽인다.
      # (성공/실패 구분은 안 한다 — 시도됐다가 실패했으면 그 실행 자체가 이미 빨갛다.)
      # 🔴 continue-on-error 금지 — 위 스모크들과 같은 이유.
      - name: Plan smoke freshness watchdog (fail if not attempted in 8 days)
        id: freshness
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-plan-smoke-freshness.mjs

      # ─── SPA 내부 이동(실 Link 클릭) 스모크 — 2026-08-01 ─────────────────────
      # framer-motion/react-router 회귀로 라우트 전환이 죽어도 트래픽이 적어 아무도
      # 신고하지 않는다 — 실 브라우저(rAF 살아있음)로 매일 실측. 검증 함정("숨은 탭은
      # rAF 정지 → 전 라우트가 거짓 고장으로 보임")은 스펙 파일 상단 주석 참조.
      # 2026-08-02: 모바일 두 프로젝트 추가. 이전에는 스펙이 헤더 링크를 딱 집어서
      # 모바일에선 거짓 실패가 났고(실측 Pixel 5 2건 fail), 그래서 Desktop Chrome
      # 하나로만 돌리고 있었다. 스펙이 "그 뷰포트에서 보이는 내비"를 고르도록 고쳐졌으니
      # 이제 하단 탭바(MobileBottomNav) 경로도 매일 실측한다 — 손님 대부분이 모바일이다.
      - name: E2E PROD nav smoke (real Link clicks)
        id: nav_smoke
        if: always()
        env:
          BASE_URL: https://cocotripkr.com
        # 🔴 continue-on-error 금지 — 위 스모크와 같은 이유(실패를 초록으로 덮는다).
        run: npx playwright test nav-link-transitions --project='Desktop Chrome' --project='Pixel 5' --project='iPhone 14 Pro' --reporter=list

      # ─── MOOD 로그인-뒤(인증) 스모크 — allowlist 게이트 뒤 MOOD 흐름 검증 ─────────
      # #1046(AI 받아적기 예약)이 "검증 없이 머지"된 갭 차단. 실 Bearer 토큰으로
      # mood-data(잔액)·mood-places(주소록)·mood-parse-schedule(AI 파싱) 인증 호출.
      # 읽기전용/파싱만 — mood-book 은 잔액을 깎으므로 스모크에서 제외(돈 안 씀).
      - name: MOOD auth smoke (login-gated)
        id: mood_smoke
        if: always()
        env:
          BASE_URL: https://cocotripkr.com
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
        # 🔴 continue-on-error 금지 — 위 스모크들과 같은 이유. 아래 단계는 전부 `if: always()`
        #   라서 이게 없어도 health-log 커밋은 그대로 돈다. 있으면 고장만 숨는다.
        run: node scripts/mood-smoke.mjs

      # ─── L3 Daily Sentinel — 받아적기 12항목 회귀 슈트 자동 실행 ────────────────
      # PR 없어도 prod 회귀를 매 cron 마다 검증. validate-prod-regression.mjs 는
      # ADMIN-BYPASS- prefix 로 실 결제 없이 5일 다도시 plan 1회 생성 + 12 assertion.
      # Secrets: pr-regression.yml 과 동일 (FIREBASE_WEB_API_KEY / HEALTH_CHECK_EMAIL /
      # HEALTH_CHECK_PASSWORD). 이미 등록돼 있다는 전제 — 미등록 시 stderr 로 명시 후 fail.
      # 비용: Gemini 1회 호출 ~$0.04/run × 13/월 ≈ $0.52/월.
      - name: Run regression suite (L3)
        id: regression
        if: always()
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          HEALTH_CHECK_EMAIL: ${{ secrets.HEALTH_CHECK_EMAIL }}
          HEALTH_CHECK_PASSWORD: ${{ secrets.HEALTH_CHECK_PASSWORD }}
          BASE_URL: https://cocotripkr.com
        run: |
          set -o pipefail
          if node scripts/validate-prod-regression.mjs 2>&1 | tee regression-output.txt; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      # 모든 핵심 단계의 실제 outcome 을 한 번 더 합산한다. 뒤 단계가 `if: always()` 여도
      # 앞 단계 실패를 놓치지 않고 issue/Telegram/final verdict 가 같은 판정을 공유한다.
      - name: Aggregate core health verdict
        id: health_verdict
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          DAILY_HEALTH_OUTCOME: ${{ steps.daily_health.outcome }}
          NPM_INSTALL_OUTCOME: ${{ steps.npm_install.outcome }}
          PLAYWRIGHT_CACHE_OUTCOME: ${{ steps.playwright-cache-chromium.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          PLAYWRIGHT_DEPS_OUTCOME: ${{ steps.playwright_deps.outcome }}
          WEEKDAY_OUTCOME: ${{ steps.weekday.outcome }}
          PLAN_SMOKE_OUTCOME: ${{ steps.plan_smoke.outcome }}
          PLAN_SMOKE_EXPECTED: ${{ github.event_name == 'workflow_dispatch' || steps.weekday.outputs.dow == '1' }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
          FRESHNESS_EXPECTED: ${{ github.event_name == 'schedule' }}
          NAV_SMOKE_OUTCOME: ${{ steps.nav_smoke.outcome }}
          MOOD_SMOKE_OUTCOME: ${{ steps.mood_smoke.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          FAILS=()

          require_success() {
            local label="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              if [ -z "$outcome" ]; then outcome="missing"; fi
              FAILS+=("${label}=${outcome}")
            fi
          }

          require_success "checkout" "$CHECKOUT_OUTCOME"
          require_success "setup-node" "$SETUP_NODE_OUTCOME"
          require_success "daily-health" "$DAILY_HEALTH_OUTCOME"
          require_success "npm-install" "$NPM_INSTALL_OUTCOME"
          require_success "playwright-cache" "$PLAYWRIGHT_CACHE_OUTCOME"
          require_success "weekday" "$WEEKDAY_OUTCOME"
          require_success "nav-smoke" "$NAV_SMOKE_OUTCOME"
          require_success "mood-smoke" "$MOOD_SMOKE_OUTCOME"
          require_success "regression" "$REGRESSION_OUTCOME"

          # 캐시 hit/miss 에 따라 둘 중 정확히 하나가 실행된다.
          if [ "$PLAYWRIGHT_INSTALL_OUTCOME" != "success" ] && [ "$PLAYWRIGHT_DEPS_OUTCOME" != "success" ]; then
            FAILS+=("playwright-browser-setup=${PLAYWRIGHT_INSTALL_OUTCOME}/${PLAYWRIGHT_DEPS_OUTCOME}")
          fi

          if [ "$PLAN_SMOKE_EXPECTED" = "true" ]; then
            require_success "plan-smoke" "$PLAN_SMOKE_OUTCOME"
          elif [ "$PLAN_SMOKE_OUTCOME" = "failure" ] || [ "$PLAN_SMOKE_OUTCOME" = "cancelled" ]; then
            FAILS+=("plan-smoke=${PLAN_SMOKE_OUTCOME}")
          fi

          if [ "$FRESHNESS_EXPECTED" = "true" ]; then
            require_success "plan-smoke-freshness" "$FRESHNESS_OUTCOME"
          elif [ "$FRESHNESS_OUTCOME" = "failure" ] || [ "$FRESHNESS_OUTCOME" = "cancelled" ]; then
            FAILS+=("plan-smoke-freshness=${FRESHNESS_OUTCOME}")
          fi

          if [ ${#FAILS[@]} -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "failed_steps=none" >> "$GITHUB_OUTPUT"
            echo "All core health steps PASS." | tee health-summary.txt
            echo "## Daily health: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            FAILED_STEPS=$(IFS=';'; echo "${FAILS[*]}")
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "failed_steps=${FAILED_STEPS}" >> "$GITHUB_OUTPUT"
            printf 'Failed core steps: %s\n' "$FAILED_STEPS" | tee health-summary.txt
            {
              echo "## Daily health: FAIL"
              echo ""
              echo "Failed core steps: \`${FAILED_STEPS}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 실패 시 같은 제목의 열린 GitHub Issue 를 갱신한다. 라벨 존재 여부에 의존하지
      # 않으므로 저장소 라벨이 정리돼도 지속 기록이 끊기지 않는다.
      - name: Open or update issue on core health failure
        if: always() && steps.health_verdict.outputs.result != 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_STEPS: ${{ steps.health_verdict.outputs.failed_steps }}
        run: |
          set -e
          if [ -z "$FAILED_STEPS" ]; then FAILED_STEPS="verdict-aggregation=missing"; fi
          TITLE="[health] Daily health check failed"
          BODY=$(printf '%s\n' \
            "> Daily Health Check 핵심 단계 중 하나 이상이 실패했습니다." \
            "" \
            "- workflow run: ${WORKFLOW_URL}" \
            "- target: https://cocotripkr.com" \
            "- failed steps: \`${FAILED_STEPS}\`" \
            "- 실행 시각 (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "" \
            "## 다음 액션" \
            "" \
            "1. 위 workflow run에서 failed steps 로그 확인" \
            "2. 원인 수정 후 workflow_dispatch 재실행" \
            "3. 통과를 확인한 뒤 이 issue close")

          ISSUE_NUM=$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[health] Daily health check failed") | .number' | head -1)

          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPOSITORY" --body "$BODY"
            echo "Updated existing issue #${ISSUE_NUM}"
          else
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "Created new issue: $TITLE"
          fi

      # 텔레그램 알림 — 운영 긴급 채널은 하나만 사용하고 secret/API 오류도 실패로 남긴다.
      # GitHub Actions 에서 secrets 는 step env 로 노출. 직접 != '' 비교는 secret 마스킹으로
      # 동작 안 함 → step 내부 shell 에서 [ -z ] 체크.
      - name: Telegram alert on core health failure
        if: always() && steps.health_verdict.outputs.result != 'pass'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_STEPS: ${{ steps.health_verdict.outputs.failed_steps }}
        run: |
          if [ -z "$FAILED_STEPS" ]; then FAILED_STEPS="verdict-aggregation=missing"; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID 미설정 — 긴급 알림을 보낼 수 없음"
            exit 1
          fi
          MSG=$(printf '%s\n' \
            "[Daily Health 실패] 자동 검사 — 고객 메시지 아님" \
            "실패 단계: ${FAILED_STEPS}" \
            "대상: https://cocotripkr.com" \
            "run: ${WORKFLOW_URL}")
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "disable_web_page_preview=true" \
            > /dev/null

      - name: Upload health log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-log-${{ github.run_id }}
          path: scripts/health-log.jsonl
          retention-days: 90

      # 앞선 스텝이 계속 실행되도록 always() 를 썼더라도 최종 결과는 반드시 빨강으로 남긴다.
      - name: Enforce final core health verdict
        if: always()
        env:
          HEALTH_RESULT: ${{ steps.health_verdict.outputs.result }}
        run: |
          if [ "$HEALTH_RESULT" != "pass" ]; then
            echo "::error::Daily Health 핵심 검사 실패 — issue와 Telegram 결과를 확인하세요."
            exit 1
          fi
          echo "Daily Health final verdict: PASS"

