# Playwright 브라우저 캐시 프라이밍 (2026-08-19).
#
# 왜: pr-i18n-smoke(smoke)·pr-visual-regression(visual)의 브라우저 캐시가
# 사실상 항상 miss 였다 — GitHub Actions 캐시는 "만든 브랜치 + main" 에서만
# 복원되는데, 두 워크플로는 PR/프리뷰 배포에서만 돌아서 main 스코프 캐시가
# 영원히 생기지 않았다. 그래서 매 PR 이 콜드 다운로드였고, Playwright CDN 이
# 매달리는 날(8/19 새벽 6회) job timeout 에 통째로 잘렸다.
#
# 해법: main 에서 같은 캐시 키로 chromium+webkit 을 받아 저장해 둔다.
# 이후 모든 PR 의 smoke/visual 이 main 캐시를 restore 해 miss 자체가 사라진다.
# 트리거 = lockfile 변경(키가 바뀌는 유일한 시점) + 주 1회(캐시 7일 미사용 축출
# 대비) + 수동.
#
# 2026-11-19 correction: the premise above does not hold for smoke/visual. Their real
# runs are deployment_status events, where GITHUB_REF is empty (Vercel deploys by commit
# SHA) and actions/cache skips restore and save entirely - see pr-i18n-smoke.yml. This
# cache is still restored by daily-health and weekly-i18n-audit (same key, run on main).
name: playwright-cache-prime

on:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
  schedule:
    - cron: '0 19 * * 0' # 일요일 04:00 KST — 미사용 축출 전에 갱신
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime:
    # 2026-10-23: ubuntu-latest 가 2026-10-12 부터 26.04 — 캐시된 Playwright webkit 이 libicu74(24.04)를 요구해 실패. 버전 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # smoke·daily-health·weekly-i18n-audit 와 같은 키·경로 (visual 은 다른 키를 쓴다).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu-24.04-playwright-chromium-webkit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-playwright-chromium-webkit-

      - name: Install Playwright browsers (prime)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # 다운로드 매달림 대비 — 시도별 5분 timeout + 3회 재시도.
        # 2026-11-19: browsers only, no `--with-deps`. The cache holds only ~/.cache/ms-playwright,
        # and with `--with-deps` a timeout during apt could not be retried: apt-get runs as
        # root through sudo, the runner-user `timeout` cannot signal it, and it kept the dpkg
        # lock. Without apt the timeout kills the whole download and a retry downloads again.
        run: |
          ok=""
          for attempt in 1 2 3; do
            if timeout -k 30 300 npx playwright install chromium webkit; then ok=1; break; fi
            echo "::warning::Playwright install attempt ${attempt} failed or timed out - retrying"
          done
          [ -n "$ok" ]
