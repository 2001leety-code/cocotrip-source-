name: Weekly Design Ops Audit

on:
  schedule:
    # 월요일 01:00 UTC = 월요일 10:00 KST.
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-design-ops-audit
  cancel-in-progress: false

jobs:
  design-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 기존 Playwright 워크플로와 같은 main 범위 캐시를 재사용한다.
      - name: Cache Playwright chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 2026-11-19: apt-get runs as root through sudo and a runner-user `timeout` cannot
      # signal it, so when the old `timeout ... install --with-deps` ran out during apt, the
      # dpkg lock stayed held and the retries failed in seconds. Now system packages (timeout run as root) and the
      # browser download are retried separately. Full note in pr-i18n-smoke.yml.
      # One step for any cache state: a cached browser is skipped fast.
      - name: Install Playwright chromium + system deps
        run: |
          ok=""
          for attempt in 1 2 3; do
            if sudo env "PATH=$PATH" timeout -k 30 300 ./node_modules/.bin/playwright install-deps chromium; then ok=1; break; fi
            echo "::warning::System packages attempt ${attempt} failed or timed out - retrying"
            sleep 10; sudo timeout 120 dpkg --configure -a || true
          done
          [ -n "$ok" ]
          ok=""
          for attempt in 1 2 3; do
            if timeout -k 30 300 npx playwright install chromium; then ok=1; break; fi
            echo "::warning::Browser download attempt ${attempt} failed or timed out - retrying"
          done
          [ -n "$ok" ]

      # 직전 성공 보고서를 작은 캐시로 복원해 finding_key의 new/resolved/unchanged를 계산한다.
      - name: Restore previous design audit result
        uses: actions/cache@v4
        with:
          path: reports/design-ops/latest.json
          key: design-ops-history-${{ github.run_id }}
          restore-keys: |
            design-ops-history-

      - name: Audit production pages (read-only, no clicks or forms)
        env:
          DESIGN_AUDIT_RUN_ID: github-${{ github.run_id }}
        run: |
          node scripts/design-ops-audit.mjs \
            --base-url https://cocotripkr.com \
            --allow-prod-readonly

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/design-ops/latest.md ]; then
            cat reports/design-ops/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# 디자인 자동감사 실패" >> "$GITHUB_STEP_SUMMARY"
            echo "보고서가 만들어지기 전에 감사 실행이 중단됐습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JSON, Markdown and first-fold screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-design-ops-${{ github.run_id }}
          path: reports/design-ops
          if-no-files-found: warn
          retention-days: 30
