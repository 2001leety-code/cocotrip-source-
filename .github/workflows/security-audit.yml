name: Security Audit

# Weekly npm audit + manual trigger. Reports high/critical vulnerabilities
# even when Dependabot hasn't yet opened a fix PR (registry advisory lag).

on:
  schedule:
    # Mondays 03:00 UTC (after Dependabot's 02:00 KST = UTC 17:00 Sun batch)
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm audit (high + critical only)
        # Production deps must be clean. Dev deps allowed to have findings
        # if upstream hasn't released a fix yet — surfaced via Dependabot PRs.
        #
        # 판정은 scripts/audit-gate.mjs 가 한다 — 허용 목록과 그 근거가 거기 있고,
        # tests/unit/audit-gate.test.ts 가 그 판정을 실제로 돌려서 검증한다.
        # (npm audit 자체의 exit code 를 쓰면 해소 경로가 없는 advisory 때문에
        #  게이트가 영원히 빨간불이 된다 — 상시 빨간불은 게이트가 아니라 소음이다.)
        run: |
          set -eo pipefail
          npm audit --json --omit=dev > audit-prod.json || true
          echo "Dev deps (informational, not blocking):"
          npm audit --audit-level=high --include=dev || true
          echo "---"
          node scripts/audit-gate.mjs audit-prod.json
