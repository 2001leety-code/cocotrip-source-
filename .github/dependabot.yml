version: 2
updates:
  # npm dependencies — group security + minor/patch into batched PRs
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    groups:
      # Security alerts always open immediately (separate from grouped PRs)
      production-deps:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Major bumps require manual review (breaking changes)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'

  # GitHub Actions versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    ignore:
      # Major bumps require manual review (workflow may break: deprecated inputs,
      # output renaming, runtime image changes). Round 9d v1 missed this — PRs
      # #67-#69 opened actions/checkout v4→v6, setup-node v4→v6, upload-artifact v4→v7.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(actions)'
